<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090c0c"><title>COURTBOARD | 농구 경기 운영</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./">◉ COURTBOARD <small>경기 운영 시스템</small></a><label class="mode-label">화면 모드 <select id="screenMode" aria-label="화면 모드"><option value="single">단일 모니터</option><option value="dual">외부 모니터</option></select></label><span id="saveState">● 기기 저장</span><button id="audioTest">♪ 소리 확인</button><button id="help">키보드 안내</button><button id="settings">설정 · 팀명 변경</button></header><button id="cornerMenu" aria-expanded="false" aria-label="설정 및 경기 관리 열기">⚙ 메뉴</button><main><aside><div class="eyebrow">TOURNAMENT DESK</div><h2>대회 · 경기 관리</h2><select id="tournaments" aria-label="대회 선택"></select><button id="newTournament">＋ 새 대회</button><div class="row section"><h3>경기 일정</h3><span id="gameCount"></span></div><div id="games"></div><button id="addGame" class="wide">＋ 경기 등록</button><div class="backup"><button id="export">대회 백업 ↓</button><button id="import">백업 복원 ↑</button><input type="file" id="file" accept="application/json" hidden><p>경기와 결과는 이 브라우저에 저장됩니다. 대회가 끝나면 백업 파일을 보관하세요.</p></div></aside><article><div class="row heading"><div><div class="eyebrow">LIVE SCOREBOARD</div><h1 id="matchTitle">경기를 선택하세요</h1></div><div><select id="view" aria-label="외부 화면 표시 방식"><option value="all">전체 전광판</option><option value="clock">계시기만</option><option value="score">점수만</option></select><button id="display">↗ 외부 뷰어 열기</button></div></div><p class="sub">두 모드 모두 같은 키보드 단축키 · 외부 모니터는 표시 전용 뷰어</p><section id="board" class="board"></section><div id="controls"></div><footer>O 경기 시작 / 정지 <b>·</b> E 샷 시작 / 정지 · W 24초 <b>·</b> Q 14초 <b>·</b> H 버저 <span>COURTBOARD / LOCAL EDITION</span></footer></article></main><dialog id="dialog"><form id="form"><div id="formContent"></div><div class="row
